{{ define "main" }}

  {{ .Content }}

  <h2>Recent Posts</h2>

  <ul class="blog-posts">
    {{ range first 5 (where .Site.RegularPages "Type" "posts") }}
    <li>
      <span>
        <i>
          <time datetime='{{ .Date.Format "2006-01-02" }}' pubdate>
            {{ .Date.Format (default "2006-01-02" .Site.Params.dateFormat) }}
          </time>
        </i>
      </span>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>

  <a href="/posts/">More posts...</a>

{{ end }}
